# One index per log source keeps searches fast and makes retention easy to tune.
# Each index is capped at 2 GB so a noisy day cannot fill the laptop's disk.

[wineventlog]
homePath   = $SPLUNK_DB/wineventlog/db
coldPath   = $SPLUNK_DB/wineventlog/colddb
thawedPath = $SPLUNK_DB/wineventlog/thaweddb
maxTotalDataSizeMB = 2048
# 90 days
frozenTimePeriodInSecs = 7776000

[sysmon]
homePath   = $SPLUNK_DB/sysmon/db
coldPath   = $SPLUNK_DB/sysmon/colddb
thawedPath = $SPLUNK_DB/sysmon/thaweddb
maxTotalDataSizeMB = 2048
frozenTimePeriodInSecs = 7776000

[powershell]
homePath   = $SPLUNK_DB/powershell/db
coldPath   = $SPLUNK_DB/powershell/colddb
thawedPath = $SPLUNK_DB/powershell/thaweddb
maxTotalDataSizeMB = 1024
frozenTimePeriodInSecs = 7776000

[defender]
homePath   = $SPLUNK_DB/defender/db
coldPath   = $SPLUNK_DB/defender/colddb
thawedPath = $SPLUNK_DB/defender/thaweddb
maxTotalDataSizeMB = 512
frozenTimePeriodInSecs = 7776000

[suricata]
homePath   = $SPLUNK_DB/suricata/db
coldPath   = $SPLUNK_DB/suricata/colddb
thawedPath = $SPLUNK_DB/suricata/thaweddb
maxTotalDataSizeMB = 1024
frozenTimePeriodInSecs = 7776000
