# Windows event log inputs for the logs that siem\setup.ps1 turns on.
# renderXml = true produces sourcetype XmlWinEventLog, which is what the
# Splunk Add-on for Microsoft Windows and the Splunk Add-on for Sysmon parse.
#
# Why local/ and not default/: Splunk_TA_windows ships [WinEventLog://Security] and
# [WinEventLog://System] with disabled = 1 in its default/. Between apps' default/ folders,
# Splunk applies settings in ASCII order of the app name, so "Splunk_TA_windows" (uppercase S)
# would override "security_labs" and keep those logs off. Any app's local/ overrides every
# app's default/, so these settings always win.

[WinEventLog://Security]
disabled = 0
index = wineventlog
renderXml = true
evt_resolve_ad_obj = 0
checkpointInterval = 5

[WinEventLog://System]
disabled = 0
index = wineventlog
renderXml = true
checkpointInterval = 5

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
renderXml = true
checkpointInterval = 5

[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = powershell
renderXml = true
checkpointInterval = 5

[WinEventLog://Microsoft-Windows-Windows Defender/Operational]
disabled = 0
index = defender
renderXml = true
checkpointInterval = 5

# Suricata IDS (installed by tools\install-tools.ps1 -Admin). One JSON event per line;
# _json gives automatic field extraction (event_type, src_ip, alert.signature, ...).
[monitor://C:\Program Files\Suricata\log\eve.json]
disabled = 0
index = suricata
sourcetype = _json
