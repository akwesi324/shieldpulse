<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="console-token" content="__CONSOLE_TOKEN__">
  <title>Security Labs Console</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="pane" id="pane" aria-label="Lab tools">
      <div class="pane-head">
        <button class="pane-toggle" id="paneToggle" type="button" aria-controls="pane" aria-expanded="true" title="Collapse tools pane ( [ )">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <a class="brand" href="#" id="homeLink">
          <!-- Shield with ECG pulse: the shield = security/protection; the pulse = active SIEM detection/monitoring. -->
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path class="shield-fill" d="M12 3.2 L4.8 6.2 L4.8 12.4 C4.8 16.4 8 20 12 21.2 C16 20 19.2 16.4 19.2 12.4 L19.2 6.2 Z"/>
            <path class="shield-outline" d="M12 3.2 L4.8 6.2 L4.8 12.4 C4.8 16.4 8 20 12 21.2 C16 20 19.2 16.4 19.2 12.4 L19.2 6.2 Z"/>
            <polyline class="pulse" points="6.4,13 8.4,13 9.4,10.2 11,15.8 12.6,11.6 13.5,13 15.6,13 17.6,13"/>
          </svg>
          <span class="pane-label">Security Labs</span>
        </a>
      </div>

      <div class="pane-search pane-label">
        <input id="filter" type="search" placeholder="Filter tools" autocomplete="off" aria-label="Filter tools">
      </div>

      <nav class="tool-nav" id="toolNav" aria-label="Tools"></nav>

      <div class="pane-foot">
        <div class="mem" id="mem" title="Memory in use">
          <div class="mem-row pane-label"><span>Memory</span><span id="memText">-</span></div>
          <div class="mem-bar"><div class="mem-fill" id="memFill"></div></div>
        </div>
        <div class="legend pane-label">
          <span><i class="dot running"></i>Running</span>
          <span><i class="dot ready"></i>Installed</span>
          <span><i class="dot missing"></i>Not installed</span>
        </div>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div class="loading">Loading tools...</div>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
